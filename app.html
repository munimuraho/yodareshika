<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171714"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.svg"><title>よだれ鹿レジ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#171714;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;font-size:17px}.shell{max-width:720px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.brand{font-weight:850;font-size:23px}.muted{color:#6b665d;font-size:13px}.card{background:white;border:1px solid #e5dfd3;border-radius:18px;margin:10px 0;padding:16px}.item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee8df;padding:12px 0;gap:8px}.item:last-child{border:0}.name{font-weight:700}.price{font-size:14px;color:#777}.step{display:flex;align-items:center;gap:12px}.step button{border:0;border-radius:12px;background:#eee9df;font-size:25px;width:51px;height:51px;touch-action:manipulation}.qty{font-size:23px;font-weight:800;min-width:23px;text-align:center}.sum{display:flex;justify-content:space-between;align-items:center;font-weight:750}.sum strong{font-size:34px}.label{font-size:15px;color:#625b50;margin-bottom:8px}input{font-family:inherit}input[type=date]{font-size:18px;padding:12px;width:100%;border:1px solid #ddd;border-radius:10px}input[type=text]{font-size:30px;max-width:100%;width:100%;padding:14px;border:2px solid #d8d2c7;border-radius:12px;text-align:right}.hint{min-height:26px;font-size:14px;color:#736d64}.primary{width:100%;border:0;border-radius:14px;background:#1e2922;color:white;font-size:23px;font-weight:800;padding:19px;touch-action:manipulation}.primary:disabled{opacity:.35}.secondary{border:1px solid #c8c0b2;background:#fff;border-radius:12px;padding:12px 14px;font-size:15px}.screen{display:none}.screen.active{display:block}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.keypad button{background:#f2eee7;border:0;border-radius:13px;font-size:27px;font-weight:700;height:56px;touch-action:manipulation}.keypad .delete{background:#ded8cc}.keypad .clear{font-size:17px}.report{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-bottom:1px solid #eee6da;padding:10px 0}.report:last-child{border:0}.history{font-size:13px;padding:10px 0;border-bottom:1px solid #eee6da}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#242824;color:white;border-radius:40px;display:none;white-space:nowrap}button{cursor:pointer}@media(min-width:600px){.shell{padding:30px}.item{padding:17px 0}} </style>
<div class="shell">
<section class="screen active" id="register"><div class="top"><div><div class="brand">🦌 よだれ鹿レジ</div><div class="muted" id="dateLabel"></div></div><button class="secondary" id="manageBtn">管理</button></div><div class="card" id="items"></div><div class="card"><div class="sum"><span>合計</span><strong id="total">¥0</strong></div></div><div class="card"><div class="label">お預かり金額（タップで入力）</div><input id="paid" type="text" inputmode="none" autocomplete="off" placeholder="0" aria-label="お預かり金額" readonly><div class="keypad" id="keypad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="clear" class="clear">クリア</button><button data-key="0">0</button><button data-key="del" class="delete">⌫</button></div><div style="height:14px"></div><div class="sum"><span>おつり</span><strong id="change">¥0</strong></div><p class="hint" id="hint">商品を選択してください</p></div><button class="primary" id="settle" disabled>決済完了</button></section>
<section class="screen" id="manage"><div class="top"><div class="brand">管理</div><button class="secondary" data-screen="register">会計に戻る</button></div><div class="card"><div class="label">出店日</div><input type="date" id="saleDate"></div><button class="primary" data-screen="sales">売上集計を見る</button><p class="muted">売上はこの端末内に保存されます。閉店後はCSVでバックアップしてください。</p></section>
<section class="screen" id="sales"><div class="top"><div class="brand">売上集計</div><button class="secondary" data-screen="manage">管理に戻る</button></div><div class="card"><div class="label">集計する日付</div><input type="date" id="reportDate"></div><div class="card"><div class="sum"><span>総売上</span><strong id="gross">¥0</strong></div><div id="salesItems"></div><hr><div class="sum"><span>手数料 15%</span><b id="fee">¥0</b></div><div class="sum"><span>差引売上</span><strong id="net">¥0</strong></div></div><div class="card"><b>会計履歴</b><div id="history"></div></div><button class="secondary" id="csv">CSV出力</button> <button class="secondary" id="undo">直前の会計を取り消す</button></section></div><div id="toast"></div>
<script>
(()=>{'use strict';const PRODUCTS=[{id:'snack',name:'おつまみセット',price:1200,unit:'個'},{id:'soup',name:'鹿ハツのミネストローネ',price:800,unit:'杯'},{id:'drink',name:'鹿の谷ハイボール',price:800,unit:'杯'}];const KEY='yodarejika-sales-v1',yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),$=s=>document.querySelector(s);let q=Object.fromEntries(PRODUCTS.map(p=>[p.id,0])),paid='',tx=[];try{tx=JSON.parse(localStorage.getItem(KEY))||[]}catch{}const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('#saleDate').value=today();$('#reportDate').value=today();function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));if(id==='sales')report();if(id==='register')$('#dateLabel').textContent='出店日 '+$('#saleDate').value}function total(){return PRODUCTS.reduce((s,p)=>s+p.price*q[p.id],0)}function update(){const t=total(),v=Number(paid||0);$('#total').textContent=yen(t);$('#paid').value=paid?Number(paid).toLocaleString('ja-JP'):'';$('#change').textContent=yen(Math.max(0,v-t));$('#settle').disabled=!(t>0&&v>=t);$('#hint').textContent=!t?'商品を選択してください':!paid?'お預かり金額を入力してください':v<t?'あと'+yen(t-v)+'不足しています':'お返し '+yen(v-t);document.querySelectorAll('[data-qty]').forEach(e=>e.textContent=q[e.dataset.qty])}$('#items').innerHTML=PRODUCTS.map(p=>'<div class="item"><div><div class="name">'+p.name+'</div><div class="price">'+yen(p.price)+'</div></div><div class="step"><button data-id="'+p.id+'" data-d="-1">−</button><span class="qty" data-qty="'+p.id+'">0</span><button data-id="'+p.id+'" data-d="1">＋</button></div></div>').join('');$('#items').addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(!b)return;q[b.dataset.id]=Math.max(0,q[b.dataset.id]+Number(b.dataset.d));update()});$('#keypad').addEventListener('click',e=>{let b=e.target.closest('[data-key]');if(!b)return;let k=b.dataset.key;if(k==='clear')paid='';else if(k==='del')paid=paid.slice(0,-1);else if(paid.length<9)paid=String(Number(paid+k));update()});function save(){try{localStorage.setItem(KEY,JSON.stringify(tx));return true}catch{alert('保存できませんでした。端末の空き容量またはブラウザ設定を確認してください。');return false}}function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1700)}$('#settle').onclick=()=>{let t=total(),v=Number(paid||0);if(!(t>0&&v>=t))return;tx.push({id:Date.now()+'-'+Math.random(),date:$('#saleDate').value,at:new Date().toISOString(),items:{...q},total:t,paid:v,change:v-t});if(!save()){tx.pop();return}q=Object.fromEntries(PRODUCTS.map(p=>[p.id,0]));paid='';update();toast('会計を記録しました')};function selected(){return tx.filter(x=>x.date===$('#reportDate').value)}function report(){let a=selected(),gross=a.reduce((s,x)=>s+x.total,0),fee=Math.round(gross*.15);$('#gross').textContent=yen(gross);$('#fee').textContent='−'+yen(fee);$('#net').textContent=yen(gross-fee);$('#salesItems').innerHTML=PRODUCTS.map(p=>{let n=a.reduce((s,x)=>s+(x.items[p.id]||0),0);return '<div class="report"><span>'+p.name+'<br><small>'+n+p.unit+'</small></span><b>'+yen(n*p.price)+'</b></div>'}).join('');$('#history').innerHTML=a.length?[...a].reverse().map(x=>'<div class="history">'+new Date(x.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'　'+PRODUCTS.filter(p=>x.items[p.id]).map(p=>p.name+'×'+x.items[p.id]).join(' / ')+'　<b>'+yen(x.total)+'</b></div>').join(''):'<p class="muted">売上はまだありません</p>';$('#undo').disabled=!a.length}$('#undo').onclick=()=>{let a=selected();if(!a.length)return;let x=a[a.length-1];if(!confirm('直前の会計 '+yen(x.total)+' を取り消しますか？'))return;let i=tx.findIndex(t=>t.id===x.id);if(i<0)return;tx.splice(i,1);if(!save()){tx.splice(i,0,x);return}report();toast('取り消しました')};$('#csv').onclick=()=>{let a=selected(),d=$('#reportDate').value,rows=[['出店日','時刻',...PRODUCTS.map(p=>p.name),'売上','お預かり','おつり']];for(let x of a)rows.push([x.date,new Date(x.at).toLocaleTimeString('ja-JP'),...PRODUCTS.map(p=>x.items[p.id]||0),x.total,x.paid,x.change]);let g=a.reduce((s,x)=>s+x.total,0),f=Math.round(g*.15);rows.push([],['総売上',g],['手数料15%',f],['手数料差引後',g-f]);const data='\uFEFF'+rows.map(r=>r.map(v=>JSON.stringify(String(v??''))).join(',')).join('\r\n'),blob=new Blob([data],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),aTag=document.createElement('a');aTag.href=url;aTag.download='よだれ鹿_売上_'+d+'.csv';aTag.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('#manageBtn').onclick=()=>show('manage');document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>show(b.dataset.screen));$('#saleDate').onchange=()=>{$('#reportDate').value=$('#saleDate').value};$('#reportDate').onchange=report;update();show('register');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();
</script>
